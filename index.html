<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>明日方舟基建排版器</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:"Microsoft YaHei","PingFang SC",sans-serif;
            background:#0b0b1a;
            color:#e8e6e3;
            padding:16px 12px 40px;
            min-height:100vh;
            background-image:radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, #0b0b1a 70%);
            overflow-x:hidden;
        }
        ::-webkit-scrollbar { width:4px; height:4px; }
        ::-webkit-scrollbar-track { background:rgba(255,255,255,0.05); border-radius:8px; }
        ::-webkit-scrollbar-thumb { background:rgba(240,196,90,0.4); border-radius:8px; }
        .app-wrap { max-width:480px; margin:0 auto; position:relative; z-index:1; }
        #splashOverlay {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:radial-gradient(ellipse at 50% 60%, #1a1a3e 0%, #0b0b1a 80%);
            z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;
            cursor:pointer; transition:opacity 0.9s cubic-bezier(0.4,0,0.2,1), visibility 0.9s ease;
            user-select:none; -webkit-tap-highlight-color:transparent;
        }
        #splashOverlay.hide { opacity:0; visibility:hidden; pointer-events:none; }
        .splash-text { text-align:center; opacity:0; animation:textFadeIn 1.2s ease 0.6s forwards; }
        .splash-text .main { font-size:2.2rem; font-weight:700; color:#f0c45a; text-shadow:0 0 40px rgba(240,196,90,0.2), 0 4px 20px rgba(0,0,0,0.6); letter-spacing:2px; line-height:1.3; }
        .splash-text .sub { font-size:0.9rem; color:rgba(255,255,255,0.3); margin-top:8px; letter-spacing:4px; font-weight:300; }
        .splash-text .highlight { color:#ff6b8a; text-shadow:0 0 30px rgba(255,107,138,0.3); }
        @keyframes textFadeIn { 0% { opacity:0; transform:translateY(16px) scale(0.96); } 100% { opacity:1; transform:translateY(0) scale(1); } }
        .tap-hint { margin-top:28px; font-size:0.75rem; color:rgba(255,255,255,0.15); letter-spacing:2px; animation:pulseHint 2s ease-in-out infinite; }
        @keyframes pulseHint { 0%,100% { opacity:0.15; transform:scale(1); } 50% { opacity:0.5; transform:scale(1.05); } }
        .header { text-align:center; padding:8px 0 18px; position:relative; }
        .header::after { content:""; display:block; width:60px; height:3px; background:linear-gradient(90deg, transparent, #f0c45a, transparent); margin:10px auto 0; border-radius:4px; }
        .header h1 { font-size:1.5rem; font-weight:700; color:#f0c45a; letter-spacing:2px; text-shadow:0 0 30px rgba(240,196,90,0.15); }
        .header h1 small { font-size:0.7rem; font-weight:400; color:rgba(255,255,255,0.35); display:block; margin-top:2px; }
        .card { background:rgba(22,33,62,0.75); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-radius:16px; padding:16px 14px; margin-bottom:14px; border:1px solid rgba(255,255,255,0.04); box-shadow:0 8px 32px rgba(0,0,0,0.4); }
        .card-title { font-size:0.85rem; font-weight:600; color:#f0c45a; letter-spacing:1px; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
        .card-title .badge { background:rgba(240,196,90,0.15); color:#f0c45a; font-size:0.65rem; padding:0 10px; border-radius:20px; font-weight:400; }
        .layout-group { display:flex; gap:10px; }
        .layout-btn { flex:1; padding:10px 0; border:2px solid rgba(255,255,255,0.08); border-radius:10px; background:rgba(255,255,255,0.02); color:rgba(255,255,255,0.5); font-size:0.95rem; font-weight:600; cursor:pointer; transition:all 0.25s; text-align:center; font-family:inherit; }
        .layout-btn:hover { border-color:rgba(240,196,90,0.3); color:#e8e6e3; }
        .layout-btn.active { border-color:#f0c45a; background:rgba(240,196,90,0.08); color:#f0c45a; box-shadow:0 0 20px rgba(240,196,90,0.06); }
        .layout-btn .sub { display:block; font-size:0.6rem; font-weight:400; opacity:0.5; margin-top:2px; }
        .layout-btn.active .sub { opacity:0.7; }
        .op-search-wrap { display:flex; gap:8px; margin-bottom:10px; }
        .op-search-wrap input { flex:1; padding:8px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.08); background:rgba(0,0,0,0.35); color:#e8e6e3; font-size:0.9rem; outline:none; transition:border-color 0.25s; font-family:inherit; }
        .op-search-wrap input::placeholder { color:rgba(255,255,255,0.25); }
        .op-search-wrap input:focus { border-color:rgba(240,196,90,0.4); }
        .op-search-wrap .clear-btn { padding:0 14px; border-radius:10px; border:none; background:rgba(255,255,255,0.05); color:rgba(255,255,255,0.3); cursor:pointer; font-size:1.1rem; transition:all 0.2s; flex-shrink:0; }
        .op-search-wrap .clear-btn:hover { background:rgba(255,255,255,0.1); color:#e8e6e3; }
        .filter-tabs { display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; margin-bottom:8px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
        .filter-tabs::-webkit-scrollbar { display:none; }
        .filter-tab { flex-shrink:0; padding:4px 14px; border-radius:20px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.45); font-size:0.75rem; font-weight:500; cursor:pointer; transition:all 0.2s; font-family:inherit; white-space:nowrap; }
        .filter-tab:hover { color:#e8e6e3; border-color:rgba(255,255,255,0.12); }
        .filter-tab.active { background:rgba(240,196,90,0.12); border-color:#f0c45a; color:#f0c45a; }
        .filter-tab .dot { display:inline-block; width:6px; height:6px; border-radius:50%; margin-right:4px; vertical-align:middle; }
        .filter-row { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
        .filter-row .filter-tab { padding:2px 12px; font-size:0.7rem; }
        .op-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; max-height:340px; overflow-y:auto; padding-right:2px; }
        @media (max-width:400px) { .op-grid { grid-template-columns:repeat(2,1fr); } }
        .op-card { display:flex; flex-direction:column; align-items:center; padding:10px 4px 8px; border-radius:12px; background:rgba(255,255,255,0.02); border:2px solid rgba(255,255,255,0.04); cursor:pointer; transition:all 0.2s ease; user-select:none; position:relative; min-height:96px; }
        .op-card:hover { background:rgba(255,255,255,0.05); border-color:rgba(255,255,255,0.08); }
        .op-card:active { transform:scale(0.96); }
        .op-card.selected { border-color:#f0c45a; background:rgba(240,196,90,0.08); box-shadow:0 0 20px rgba(240,196,90,0.06); }
        .op-card.selected .op-avatar { box-shadow:0 0 0 3px rgba(240,196,90,0.3); }
        .op-card .check-mark { position:absolute; top:4px; right:6px; font-size:0.7rem; color:#f0c45a; opacity:0; transform:scale(0.6); transition:all 0.2s; }
        .op-card.selected .check-mark { opacity:1; transform:scale(1); }
        .op-card.disabled { opacity:0.3; cursor:not-allowed; pointer-events:none; filter:grayscale(0.6); }
        .op-avatar { width:56px; height:56px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.1rem; font-weight:700; color:#fff; flex-shrink:0; transition:box-shadow 0.2s; margin-bottom:4px; text-shadow:0 1px 4px rgba(0,0,0,0.3); background-size:cover !important; background-position:center !important; background-repeat:no-repeat !important; overflow:hidden; position:relative; }
        .op-avatar img { width:100%; height:100%; object-fit:cover; border-radius:50%; display:block; }
        .op-avatar .fallback-text { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-weight:700; font-size:1.2rem; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,0.5); }
        .op-name { font-size:0.7rem; font-weight:500; color:#c8c6c3; text-align:center; line-height:1.2; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
        .op-meta { font-size:0.55rem; color:rgba(255,255,255,0.3); text-align:center; line-height:1.3; margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
        .op-meta .star { color:#f0c45a; letter-spacing:1px; }
        .op-meta .class-tag { background:rgba(255,255,255,0.06); padding:0 6px; border-radius:8px; margin-left:4px; }
        .op-meta .elite-tag { background:rgba(255,215,0,0.15); color:#ffd700; padding:0 6px; border-radius:8px; margin-left:4px; font-size:0.6rem; }
        .op-tag { font-size:0.5rem; padding:1px 8px; border-radius:10px; background:rgba(255,255,255,0.06); color:rgba(255,255,255,0.35); margin-top:2px; letter-spacing:0.3px; }
        .op-card.selected .op-tag { color:rgba(240,196,90,0.6); }
        .color-trade { background:linear-gradient(135deg, #2d5f9e, #4a7fc7); }
        .color-赤金 { background:linear-gradient(135deg, #c9922a, #f0c45a); }
        .color-经验 { background:linear-gradient(135deg, #2d7d4a, #4caf7a); }
        .color-源石 { background:linear-gradient(135deg, #6d2d8a, #9c4dca); }
        .color-通用 { background:linear-gradient(135deg, #4a4a5a, #7a7a8a); }
        .color-中枢 { background:linear-gradient(135deg, #6d28d9, #a78bfa); }
        .color-默认 { background:linear-gradient(135deg, #3a3a4a, #5a5a6a); }
        .op-stats { display:flex; justify-content:space-between; align-items:center; margin-top:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.04); flex-wrap:wrap; gap:6px; }
        .op-stats .count { font-size:0.8rem; color:rgba(255,255,255,0.5); }
        .op-stats .count strong { color:#f0c45a; font-weight:600; }
        .op-stats .actions { display:flex; gap:6px; }
        .op-stats .actions button { padding:4px 14px; border-radius:8px; border:1px solid rgba(255,255,255,0.06); background:rgba(255,255,255,0.04); color:rgba(255,255,255,0.5); font-size:0.7rem; font-weight:500; cursor:pointer; transition:all 0.2s; font-family:inherit; }
        .op-stats .actions button:hover { background:rgba(255,255,255,0.08); color:#e8e6e3; }
        .op-stats .actions button:active { transform:scale(0.95); }
        .btn-generate { width:100%; padding:14px 0; border:none; border-radius:12px; background:linear-gradient(135deg, #e94560, #c23152); color:#fff; font-size:1.05rem; font-weight:700; font-family:inherit; cursor:pointer; transition:all 0.25s; letter-spacing:1px; box-shadow:0 4px 24px rgba(233,69,96,0.25); }
        .btn-generate:hover { transform:translateY(-1px); box-shadow:0 8px 32px rgba(233,69,96,0.35); }
        .btn-generate:active { transform:scale(0.97); }
        .btn-generate:disabled { opacity:0.4; cursor:not-allowed; transform:none !important; box-shadow:none; }
        #resultCard { display:none; animation:fadeUp 0.35s ease; }
        @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
        #result { padding:8px 0; max-height:500px; overflow-y:auto; }
        .result-strategy { font-size:0.9rem; color:#f0c45a; border-bottom:1px solid rgba(255,255,255,0.06); padding-bottom:10px; margin-bottom:12px; }
        .result-station { background:rgba(255,255,255,0.03); border-radius:12px; padding:10px 12px; margin-bottom:12px; border:1px solid rgba(255,255,255,0.04); }
        .station-title { font-weight:600; color:#f0c45a; font-size:0.85rem; margin-bottom:6px; letter-spacing:0.5px; }
        .station-title .station-tag { font-size:0.6rem; font-weight:400; color:rgba(255,255,255,0.5); margin-left:8px; background:rgba(255,255,255,0.06); padding:0 8px; border-radius:10px; }
        .station-title .station-tag.cooperation { color:#4caf7a; background:rgba(76,175,122,0.15); }
        .station-title .station-tag.longmen { color:#4a7fc7; background:rgba(74,127,199,0.15); }
        .shift-row { display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; padding:4px 0; }
        .shift-label { font-size:0.7rem; color:rgba(255,255,255,0.4); min-width:40px; flex-shrink:0; }
        .result-operator { display:inline-flex; align-items:center; gap:4px; background:rgba(255,255,255,0.05); border-radius:20px; padding:2px 8px 2px 2px; border:1px solid rgba(255,255,255,0.06); transition:background 0.2s; }
        .result-operator:hover { background:rgba(255,255,255,0.1); }
        .result-avatar { width:28px; height:28px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#2a2a3a; font-size:0.65rem; font-weight:700; color:#fff; }
        .result-avatar img { width:100%; height:100%; object-fit:cover; display:block; }
        .result-avatar .fallback { font-size:0.7rem; font-weight:700; color:#fff; }
        .result-info { display:flex; align-items:center; gap:4px; font-size:0.7rem; color:#c8c6c3; white-space:nowrap; }
        .result-info .rname { max-width:60px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
        .result-info .rstar { color:#f0c45a; font-size:0.6rem; }
        .result-info .rclass { background:rgba(255,255,255,0.06); padding:0 4px; border-radius:4px; font-size:0.55rem; color:rgba(255,255,255,0.5); }
        .result-info .relite { background:rgba(255,215,0,0.12); color:#ffd700; padding:0 4px; border-radius:4px; font-size:0.5rem; }
        .result-placeholder { color:rgba(255,255,255,0.3); font-size:0.75rem; font-style:italic; }
        .result-unused { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06); font-size:0.75rem; color:rgba(255,255,255,0.4); }
        .result-unused span { color:#c8c6c3; }
        .empty-state { text-align:center; padding:28px 0 16px; color:rgba(255,255,255,0.2); font-size:0.85rem; }
        .empty-state .icon { font-size:2rem; display:block; margin-bottom:6px; opacity:0.4; }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:rgba(22,33,62,0.95); backdrop-filter:blur(12px); padding:10px 24px; border-radius:12px; border:1px solid rgba(240,196,90,0.15); color:#e8e6e3; font-size:0.85rem; opacity:0; transition:all 0.4s ease; pointer-events:none; z-index:999; max-width:90%; text-align:center; }
        .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
        @media (max-width:420px) { .splash-text .main { font-size:1.6rem; } .splash-text .sub { font-size:0.75rem; } .tap-hint { font-size:0.65rem; } .op-avatar { width:48px; height:48px; font-size:1rem; } .op-avatar .fallback-text { font-size:1rem; } .op-card { min-height:84px; } .result-info .rname { max-width:40px; } .result-avatar { width:24px; height:24px; } .result-operator { padding:1px 6px 1px 1px; } }
    </style>
</head>
<body>
    <div id="splashOverlay">
        <div class="splash-text">
            <div class="main">🐾 抖音关注 <span class="highlight">黑猫</span> 谢谢喵！</div>
            <div class="sub">✦ 明日方舟 · 基建排版器 ✦</div>
        </div>
        <div class="tap-hint">✦ 点击任意处进入 ✦</div>
    </div>

    <div class="app-wrap">
        <header class="header">
            <h1>🔧 基建排版器 <small>ARKNIGHTS · 两班倒</small></h1>
        </header>

        <section class="card">
            <div class="card-title">📐 布局方案</div>
            <div class="layout-group" id="layoutGroup">
                <button class="layout-btn active" data-layout="243">243 <span class="sub">2贸易 · 4制造</span></button>
                <button class="layout-btn" data-layout="333">333 <span class="sub">3贸易 · 3制造</span></button>
            </div>
        </section>

        <section class="card" id="opSection">
            <div class="card-title">
                🧑‍🚀 干员选择
                <span class="badge" id="opCountBadge">0 已选</span>
            </div>
            <div class="op-search-wrap">
                <input type="text" id="opSearch" placeholder="搜索干员..." autocomplete="off" />
                <button class="clear-btn" id="clearSearchBtn" title="清除搜索">✕</button>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="中枢"><span class="dot" style="background:#a78bfa;"></span>中枢</button>
                <button class="filter-tab" data-filter="贸易站"><span class="dot" style="background:#4a7fc7;"></span>贸易</button>
                <button class="filter-tab" data-filter="赤金"><span class="dot" style="background:#f0c45a;"></span>赤金</button>
                <button class="filter-tab" data-filter="经验"><span class="dot" style="background:#4caf7a;"></span>经验</button>
                <button class="filter-tab" data-filter="源石"><span class="dot" style="background:#9c4dca;"></span>源石</button>
                <button class="filter-tab" data-filter="通用"><span class="dot" style="background:#7a7a8a;"></span>通用</button>
            </div>
            <div class="filter-row" id="starFilterRow">
                <span style="color:rgba(255,255,255,0.3); font-size:0.7rem; margin-right:4px;">⭐</span>
                <button class="filter-tab active" data-star="all">全部</button>
                <button class="filter-tab" data-star="6">★6</button>
                <button class="filter-tab" data-star="5">★5</button>
                <button class="filter-tab" data-star="4">★4</button>
                <button class="filter-tab" data-star="3">★3</button>
                <button class="filter-tab" data-star="2">★2</button>
                <button class="filter-tab" data-star="1">★1</button>
            </div>
            <div class="filter-row" id="classFilterRow">
                <span style="color:rgba(255,255,255,0.3); font-size:0.7rem; margin-right:4px;">职业</span>
                <button class="filter-tab active" data-class="all">全部</button>
                <button class="filter-tab" data-class="先锋">先锋</button>
                <button class="filter-tab" data-class="近卫">近卫</button>
                <button class="filter-tab" data-class="重装">重装</button>
                <button class="filter-tab" data-class="狙击">狙击</button>
                <button class="filter-tab" data-class="术师">术师</button>
                <button class="filter-tab" data-class="医疗">医疗</button>
                <button class="filter-tab" data-class="辅助">辅助</button>
                <button class="filter-tab" data-class="特种">特种</button>
            </div>
            <div class="op-grid" id="opGrid"></div>
            <div class="op-stats">
                <span class="count">已选 <strong id="selectedCount">0</strong> / <span id="totalCount">0</span> 名干员</span>
                <div class="actions">
                    <button id="selectAllBtn">全选</button>
                    <button id="invertBtn">反选</button>
                </div>
            </div>
        </section>

        <button class="btn-generate" id="generateBtn">📋 生成两班倒方案</button>

        <section class="card" id="resultCard">
            <div class="card-title">📋 排版结果</div>
            <div id="result"></div>
        </section>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // =====================================================================
        //  开场动画
        // =====================================================================
        (function splash() {
            const overlay = document.getElementById('splashOverlay');
            function dismiss() {
                overlay.classList.add('hide');
                overlay.removeEventListener('click', dismiss);
                overlay.removeEventListener('touchstart', dismiss);
                document.removeEventListener('keydown', keyHandler);
            }
            function keyHandler(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    dismiss();
                }
            }
            overlay.addEventListener('click', dismiss);
            overlay.addEventListener('touchstart', dismiss, { passive: true });
            document.addEventListener('keydown', keyHandler);
            setTimeout(dismiss, 4200);
        })();

        // =====================================================================
        //  干员数据（完整版）
        // =====================================================================
        const FIXED_ONLY_OPS = new Set([
            "火神", "泡泡", "多萝西", "娜斯提", "温蒂", "冬时", "森蚺", "槐琥", "贝娜",
            "Miss.Christine", "圣约送葬人", "卡达", "豆苗", "蛇屠箱", "黑角", "引星棘刺", "褐果",
            "蕾缪安", "柏喙", "卡夫卡", "明椒", "折光", "琳琅诗怀雅",
            "伺夜", "空弦", "深巡", "吉星", "石英", "维娜·维多利亚", "空爆", "月见夜", "古米", "齐尔查克",
            "慕斯", "夜刀", "玫兰莎", "梓兰", "远山", "焰狐龙梓兰", "雷狼龙S空爆", "推进之王", "摩根", "贝洛内",
            "丰川祥子", "三角初华", "若叶睦", "祐天寺若麦"
        ]);

        const SINGLE_HANG_FORBIDDEN = new Set([
            "卡夫卡", "柏喙", "贝洛内", "德克萨斯", "拉普兰德",
            "孑", "明椒", "摩根", "推进之王", "琳琅诗怀雅", "崖心", "折光",
            "红云", "火神", "龙舌兰"

        // =====================================================================
        //  ★★★ 修复：allocateTrade 组合匹配增加临时去重 ★★★
        // =====================================================================
        function allocateTrade(availableSet, numStations) {
            const used = new Set();
            const teams = [];
            const available = new Set(availableSet);
            for (let combo of TRADE_COMBOS) {
                if (teams.length >= numStations) break;
                let chosen = [], possible = true;
                let tempUsed = new Set(); // 本组合临时使用集合
                for (let reqSet of combo.required) {
                    let found = null;
                    for (let name of reqSet) {
                        if (available.has(name) && !used.has(name) && !tempUsed.has(name)) {
                            found = name;
                            break;
                        }
                    }
                    if (!found) { possible = false; break; }
                    chosen.push(found);
                    tempUsed.add(found);
                }
                if (possible) {
                    teams.push(chosen);
                    chosen.forEach(n => { used.add(n); available.delete(n); });
                }
            }
            while (teams.length < numStations) {
                let team = null;
                const getHighEfficiency = (exclude) => {
                    const candidates = [];
                    for (let name of available) {
                        if (used.has(name)) continue;
                        if (SINGLE_HANG_FORBIDDEN.has(name)) continue;
                        if (name === '但书' || name === '可露希尔') continue;
                        if (exclude && exclude.has(name)) continue;
                        const op = OPERATORS[name];
                        if (op && op.facility === '贸易站' && op.base >= 0.28) {
                            candidates.push({ name, base: op.base });
                        }
                    }
                    candidates.sort((a, b) => b.base - a.base || a.name.localeCompare(b.name));
                    return candidates.map(c => c.name);
                };
                if (available.has('但书') && !used.has('但书') && !SINGLE_HANG_FORBIDDEN.has('但书')) {
                    const high = getHighEfficiency(new Set(['但书']));
                    if (high.length >= 2) {
                        team = ['但书', high[0], high[1]];
                        teams.push(team);
                        team.forEach(n => { used.add(n); available.delete(n); });
                        continue;
                    }
                }
                if (available.has('可露希尔') && !used.has('可露希尔') && !SINGLE_HANG_FORBIDDEN.has('可露希尔')) {
                    const high = getHighEfficiency(new Set(['可露希尔']));
                    if (high.length >= 2) {
                        team = ['可露希尔', high[0], high[1]];
                        teams.push(team);
                        team.forEach(n => { used.add(n); available.delete(n); });
                        continue;
                    }
                }
                let pairTeam = null;
                for (let pair of TRADE_PAIRS) {
                    const [a, b] = pair;
                    if (available.has(a) && available.has(b) && !used.has(a) && !used.has(b)) {
                        const third = [...available].filter(n => {
                            if (used.has(n) || n === a || n === b) return false;
                            return (OPERATORS[n].facility === "贸易站" || n === '芬');
                        })
                        .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                        .sort((x, y) => {
                            const idxX = TRADE_TIERS.findIndex(t => t.includes(x));
                            const idxY = TRADE_TIERS.findIndex(t => t.includes(y));
                            if (idxX === -1 && idxY === -1) return getBaseEff(y, "通用", "贸易站") - getBaseEff(x, "通用", "贸易站");
                            if (idxX === -1) return 1;
                            if (idxY === -1) return -1;
                            return idxX - idxY || getBaseEff(y, "通用", "贸易站") - getBaseEff(x, "通用", "贸易站");
                        })[0];
                        if (third) pairTeam = [a, b, third];
                        else pairTeam = [a, b];
                        break;
                    }
                }
                if (pairTeam) {
                    teams.push(pairTeam);
                    pairTeam.forEach(n => { used.add(n); available.delete(n); });
                    continue;
                }
                const candidates = [];
                for (let tier of TRADE_TIERS) {
                    for (let name of tier) {
                        if (available.has(name) && !used.has(name) && (OPERATORS[name].facility === "贸易站" || name === '芬') && !SINGLE_HANG_FORBIDDEN.has(name)) {
                            candidates.push(name);
                        }
                    }
                }
                const rest = [...available].filter(n => !used.has(n) && (OPERATORS[n].facility === "贸易站" || n === '芬') && !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, "通用", "贸易站") - getBaseEff(a, "通用", "贸易站"));
                for (let n of rest) if (!candidates.includes(n)) candidates.push(n);
                const teamFinal = candidates.slice(0, 3);
                if (teamFinal.length === 0) teams.push(["无合适干员"]);
                else { teams.push(teamFinal); teamFinal.forEach(n => { used.add(n); available.delete(n); }); }
            }
            return { teams, used };
        }

        // =====================================================================
        //  制造站分配
        // =====================================================================
        function getBaseEff(name, product, facilityType) {
            const op = OPERATORS[name];
            if (!op) return 0;
            if (name === '芬') {
                if (facilityType === '贸易站') return 0.15;
                if (facilityType === '制造站' && product === '通用') return 0.20;
                return 0.20;
            }
            if (product && op.product !== "通用" && op.product !== product) return 0;
            return op.base;
        }

        // =====================================================================
        //  ★★★ 修复：allocateProduct 组合匹配增加临时去重 ★★★
        // =====================================================================
        function allocateProduct(availableSet, combos, product, numStations) {
            const used = new Set();
            const teams = [];
            const available = new Set(availableSet);
            for (let combo of combos) {
                if (teams.length >= numStations) break;
                let chosen = [], possible = true;
                let tempUsed = new Set(); // 本组合临时使用集合
                for (let reqSet of combo.required) {
                    let found = null;
                    for (let name of reqSet) {
                        if (available.has(name) && !used.has(name) && !tempUsed.has(name)) {
                            found = name;
                            break;
                        }
                    }
                    if (!found) { possible = false; break; }
                    chosen.push(found);
                    tempUsed.add(found);
                }
                if (possible) {
                    teams.push(chosen);
                    chosen.forEach(n => { used.add(n); available.delete(n); });
                }
            }
            while (teams.length < numStations) {
                const productCandidates = [...available].filter(n => {
                    if (used.has(n) || FIXED_ONLY_OPS.has(n)) return false;
                    const op = OPERATORS[n];
                    if (n === '芬') return product === '通用';
                    return op && op.facility === "制造站" && op.product === product;
                })
                .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                .sort((a, b) => getBaseEff(b, product, "制造站") - getBaseEff(a, product, "制造站"));
                let team = productCandidates.slice(0, 3);
                if (team.length < 3) {
                    const genericCandidates = [...available].filter(n => {
                        if (used.has(n) || FIXED_ONLY_OPS.has(n)) return false;
                        const op = OPERATORS[n];
                        if (n === '芬') return product === '通用';
                        return op && op.facility === "制造站" && op.product === "通用";
                    })
                    .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, product, "制造站") - getBaseEff(a, product, "制造站"));
                    const needed = 3 - team.length;
                    team = team.concat(genericCandidates.slice(0, needed));
                }
                if (team.length === 0) teams.push(["无合适干员"]);
                else { teams.push(team); team.forEach(n => { used.add(n); available.delete(n); }); }
            }
            return { teams, used };
        }

                    const otherSource = [...available].filter(n => {
                        if (used.has(n) || n === coreCandidate || n === excludeCore) return false;
                        if (FIXED_ONLY_OPS.has(n) && n !== "蛇屠箱" && n !== "黑角") return false;
                        const op = OPERATORS[n];
                        return op && op.facility === "制造站" && op.product === "源石材料";
                    })
                    .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, "源石材料", "制造站") - getBaseEff(a, "源石材料", "制造站"));

                    if (otherSource.length >= 2) {
                        team = [coreCandidate, ...otherSource.slice(0, 2)];
                    } else if (otherSource.length === 1) {
                        const genericFill = [...available].filter(n => {
                            if (used.has(n) || n === coreCandidate || n === excludeCore) return false;
                            if (FIXED_ONLY_OPS.has(n)) return false;
                            const op = OPERATORS[n];
                            return op && op.facility === "制造站" && op.product === "通用";
                        })
                        .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                        .sort((a, b) => getBaseEff(b, "源石材料", "制造站") - getBaseEff(a, "源石材料", "制造站"));
                        if (genericFill.length >= 1) {
                            team = [coreCandidate, ...otherSource.slice(0, 1), genericFill[0]];
                        }
                    }
                }

                if (!team) {
                    const pureSource = [...available].filter(n => {
                        if (used.has(n)) return false;
                        if (FIXED_ONLY_OPS.has(n) && n !== "蛇屠箱" && n !== "黑角") return false;
                        const op = OPERATORS[n];
                        return op && op.facility === "制造站" && op.product === "源石材料";
                    })
                    .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, "源石材料", "制造站") - getBaseEff(a, "源石材料", "制造站"));

                    if (pureSource.length >= 3) {
                        team = pureSource.slice(0, 3);
                    } else {
                        const genericFill = [...available].filter(n => {
                            if (used.has(n) || FIXED_ONLY_OPS.has(n)) return false;
                            const op = OPERATORS[n];
                            return op && op.facility === "制造站" && op.product === "通用";
                        })
                        .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                        .sort((a, b) => getBaseEff(b, "源石材料", "制造站") - getBaseEff(a, "源石材料", "制造站"));
                        team = pureSource.concat(genericFill).slice(0, 3);
                    }
                }

                if (!team || team.length === 0) {
                    teams.push(["无合适干员"]);
                } else {
                    teams.push(team);
                    team.forEach(n => { used.add(n); available.delete(n); });
                }
            }

            return { teams, used };
        }

        // =====================================================================
        //  全局分配
        // =====================================================================
        function fullAllocationWithTradeForbidden(owned, tradeCount, akCount, oriCount, expCount, tradeForbiddenList = []) {
            const globalAvailable = new Set(owned);
            const assignments = {};
            const usedTotal = new Set();

            const akRes = allocateProduct(globalAvailable, AK_COMBOS, "赤金", akCount);
            for (let i = 0; i < akCount; i++) assignments[`赤金制造站${i+1}`] = akRes.teams[i] || ["无合适干员"];
            akRes.used.forEach(n => { usedTotal.add(n); globalAvailable.delete(n); });

            const oriRes = allocateOriginium(globalAvailable, oriCount);
            for (let i = 0; i < oriCount; i++) assignments[`源石制造站${i+1}`] = oriRes.teams[i] || ["无合适干员"];
            oriRes.used.forEach(n => { usedTotal.add(n); globalAvailable.delete(n); });

            for (let i = 0; i < tradeCount; i++) {
                const forbidden = (i < tradeForbiddenList.length) ? tradeForbiddenList[i] : new Set();
                const tradeRes = allocateTradeWithForbidden(globalAvailable, 1, forbidden);
                assignments[`贸易站${i+1}`] = tradeRes.teams[0] || ["无合适干员"];
                tradeRes.used.forEach(n => { usedTotal.add(n); globalAvailable.delete(n); });
            }

            const expRes = allocateProduct(globalAvailable, EXPERIENCE_COMBOS, "经验", expCount);
            for (let i = 0; i < expCount; i++) assignments[`经验制造站${i+1}`] = expRes.teams[i] || ["无合适干员"];
            expRes.used.forEach(n => { usedTotal.add(n); globalAvailable.delete(n); });

            return { assignments, used: usedTotal, unused: [...globalAvailable] };
        }

        function assignBothShiftsWithTradeForbidden(owned, tradeCount, akCount, oriCount, expCount, tradeForbiddenList = []) {
            const first = fullAllocationWithTradeForbidden(owned, tradeCount, akCount, oriCount, expCount, tradeForbiddenList);
            const remaining = owned.filter(op => !first.used.has(op));
            const second = fullAllocationWithTradeForbidden(remaining, tradeCount, akCount, oriCount, expCount, tradeForbiddenList);
            return { first, second };
        }

        function fullAllocation(owned, tradeCount, akCount, oriCount, expCount) {
            return fullAllocationWithTradeForbidden(owned, tradeCount, akCount, oriCount, expCount, []);
        }

        function assignBothShifts(owned, tradeCount, akCount, oriCount, expCount) {
            return assignBothShiftsWithTradeForbidden(owned, tradeCount, akCount, oriCount, expCount, []);
        }

        // =====================================================================
        //  头像辅助
        // =====================================================================
        function getAvatarUrl(name) { return 'picture/' + name + '.jpg'; }

        // =====================================================================
        //  UI 交互
        // =====================================================================
        let selectedOps = new Set();
        let currentLayout = '243';
        let currentFilter = 'all';
        let searchQuery = '';
        let starFilter = 'all';
        let classFilter = 'all';

        const layoutBtns = document.querySelectorAll('.layout-btn');
        const opGrid = document.getElementById('opGrid');
        const opSearch = document.getElementById('opSearch');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const filterTabs = document.getElementById('filterTabs');
        const starFilterRow = document.getElementById('starFilterRow');
        const classFilterRow = document.getElementById('classFilterRow');
        const selectedCountEl = document.getElementById('selectedCount');
        const totalCountEl = document.getElementById('totalCount');
        const opCountBadge = document.getElementById('opCountBadge');
        const generateBtn = document.getElementById('generateBtn');
        const resultCard = document.getElementById('resultCard');
        const resultEl = document.getElementById('result');
        const toastEl = document.getElementById('toast');

        const allOpNames = Object.keys(OPERATORS).sort((a, b) => a.localeCompare(b, 'zh'));

        function getOpColorClass(name) {
            const op = OPERATORS[name];
            if (!op) return 'color-默认';
            if (op.facility === '控制中枢') return 'color-中枢';
            if (op.facility === '贸易站') return 'color-trade';
            if (op.product === '赤金') return 'color-赤金';
            if (op.product === '经验') return 'color-经验';
            if (op.product === '源石材料') return 'color-源石';
            if (op.product === '通用') return 'color-通用';
            return 'color-默认';
        }

        function getOpTag(name) {
            const op = OPERATORS[name];
            if (!op) return '';
            if (op.facility === '控制中枢') return '中枢';
            if (op.facility === '贸易站') return '贸易';
            return op.product === '通用' ? '通用' : op.product;
        }

        function renderGrid() {
            const filter = currentFilter;
            const query = searchQuery.trim().toLowerCase();
            const star = starFilter;
            const cls = classFilter;

            let filtered = allOpNames.filter(name => {
                if (query && !name.toLowerCase().includes(query)) return false;
                const op = OPERATORS[name];
                if (!op) return false;
                if (filter === '中枢') { if (op.facility !== '控制中枢') return false; }
                if (filter === '贸易站') {
                    if (name === '芬') return true;
                    if (op.facility !== '贸易站') return false;
                }
                if (filter === '通用') {
                    if (name === '芬') return true;
                    if (!(op.facility === '制造站' && op.product === '通用')) return false;
                }
                if (filter === '赤金' && !(op.facility === '制造站' && op.product === '赤金')) return false;
                if (filter === '经验' && !(op.facility === '制造站' && op.product === '经验')) return false;
                if (filter === '源石' && !(op.facility === '制造站' && op.product === '源石材料')) return false;
                if (star !== 'all' && op.star !== parseInt(star)) return false;
                if (cls !== 'all' && op.class !== cls) return false;
                return true;
            });

            filtered.sort((a, b) => {
                const aSel = selectedOps.has(a) ? 1 : 0;
                const bSel = selectedOps.has(b) ? 1 : 0;
                return bSel - aSel;
            });

            if (filtered.length === 0) {
                opGrid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;"><span class="icon">🔍</span>没有匹配的干员</div>`;
                return;
            }

            let html = '';
            for (let name of filtered) {
                const isSelected = selectedOps.has(name);
                const isForbidden = false;
                const colorClass = getOpColorClass(name);
                const tag = getOpTag(name);
                const initial = name.charAt(0).toUpperCase();
                const avatarUrl = getAvatarUrl(name);
                const op = OPERATORS[name];
                const star = op && op.star ? op.star : 0;
                const cls = op && op.class ? op.class : '';
                const starStr = star > 0 ? '★'.repeat(star) : '';
                const elite = op && op.elite ? op.elite : '';

                let avatarHtml = '';
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" alt="${name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback-text\\'>${initial}</span>'; this.parentElement.style.background='';">`;
                } else {
                    avatarHtml = `<span class="fallback-text">${initial}</span>`;
                }

                let metaParts = [];
                if (starStr) metaParts.push(`<span class="star">${starStr}</span>`);
                if (cls) metaParts.push(`<span class="class-tag">${cls}</span>`);
                if (elite) metaParts.push(`<span class="elite-tag">${elite}</span>`);
                const metaHtml = metaParts.join('');

                html += `
                    <div class="op-card ${isSelected ? 'selected' : ''} ${isForbidden ? 'disabled' : ''}" data-op="${name}">
                        <span class="check-mark">✓</span>
                        <div class="op-avatar ${colorClass}">${avatarHtml}</div>
                        <div class="op-name">${name}</div>
                        <div class="op-meta">${metaHtml}</div>
                        ${tag ? `<div class="op-tag">${tag}</div>` : ''}
                    </div>
                `;
            }
            opGrid.innerHTML = html;

            totalCountEl.textContent = allOpNames.length;
            selectedCountEl.textContent = selectedOps.size;
            opCountBadge.textContent = `${selectedOps.size} 已选`;

            document.querySelectorAll('.op-card:not(.disabled)').forEach(el => {
                el.addEventListener('click', () => {
                    const name = el.dataset.op;
                    toggleOp(name);
                });
            });

            updateGenerateBtn();
        }

        function toggleOp(name) {
            if (selectedOps.has(name)) selectedOps.delete(name);
            else selectedOps.add(name);
            renderGrid();
            updateGenerateBtn();
        }

        function selectAll() {
            const available = allOpNames;
            if (selectedOps.size === available.length) selectedOps.clear();
            else available.forEach(n => selectedOps.add(n));
            renderGrid();
            updateGenerateBtn();
        }

        function invertSelect() {
            const available = allOpNames;
            const newSet = new Set();
            for (let name of available) {
                if (!selectedOps.has(name)) newSet.add(name);
            }
            selectedOps = newSet;
            renderGrid();
            updateGenerateBtn();
        }

        function updateGenerateBtn() {
            const count = selectedOps.size;
            generateBtn.disabled = count === 0;
            generateBtn.textContent = count === 0 ? '⚠️ 请至少选择一名干员' : '📋 生成两班倒方案';
        }

        let toastTimer = null;
        function showToast(msg, duration = 2000) {
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => { toastEl.classList.remove('show'); }, duration);
        }

        function setLayout(layout) {
            currentLayout = layout;
            layoutBtns.forEach(btn => {
                btn.classList.toggle('active', btn.dataset.layout === layout);
            });
            renderGrid();
            updateGenerateBtn();
            showToast(`切换到 ${layout === '243' ? '243（2贸易 4制造）' : '333（3贸易 3制造）'}`, 1200);
        }

        function setFilter(filter) {
            currentFilter = filter;
            filterTabs.querySelectorAll('.filter-tab').forEach(el => {
                el.classList.toggle('active', el.dataset.filter === filter);
            });
            renderGrid();
        }

        function setStarFilter(star) {
            starFilter = star;
            starFilterRow.querySelectorAll('.filter-tab').forEach(el => {
                el.classList.toggle('active', el.dataset.star === star);
            });
            renderGrid();
        }

        function setClassFilter(cls) {
            classFilter = cls;
            classFilterRow.querySelectorAll('.filter-tab').forEach(el => {
                el.classList.toggle('active', el.dataset.class === cls);
            });
            renderGrid();
        }

        function doSearch() {
            searchQuery = opSearch.value;
            renderGrid();
        }

        // =====================================================================
        //  生成排班结果
        // =====================================================================
        function generatePlan() {
            const owned = Array.from(selectedOps);
            if (owned.length === 0) {
                showToast('请至少选择一名干员！', 1800);
                return;
            }

            let tradeCount, akCount, oriCount, expCount, strategy;
            let tradeLabels = [];
            let tradeForbiddenList = [];

            if (currentLayout === '243') {
                tradeCount = 2; akCount = 2; oriCount = 0; expCount = 2;
                strategy = '龙门商法（全部贸易站）';
                tradeLabels = ['龙门商法', '龙门商法'];
                tradeForbiddenList = [new Set(), new Set()];
            } else {
                tradeCount = 3; akCount = 2; oriCount = 1; expCount = 0;
                strategy = '2龙门商法 + 1开采协力';
                tradeLabels = ['开采协力', '龙门商法', '龙门商法'];
                tradeForbiddenList = [
                    new Set(['但书', '可露希尔', '巫恋']),
                    new Set(),
                    new Set()
                ];
            }

            let availableSet = new Set(owned);
            const center1 = allocateControlCenter(availableSet);
            const centerUsed1 = center1.used;
            centerUsed1.forEach(name => availableSet.delete(name));

            const center2 = allocateControlCenter(availableSet);
            const centerUsed2 = center2.used;
            centerUsed2.forEach(name => availableSet.delete(name));

            const remaining = Array.from(availableSet);
            const { first, second } = assignBothShiftsWithTradeForbidden(
                remaining,
                tradeCount,
                akCount,
                oriCount,
                expCount,
                tradeForbiddenList
            );

            function buildOperatorHtml(name) {
                if (name === '无合适干员') return `<span class="result-placeholder">无合适干员</span>`;
                const op = OPERATORS[name];
                if (!op) return `<span class="result-placeholder">${name}</span>`;
                const avatarUrl = getAvatarUrl(name);
                const starStr = op.star ? '★'.repeat(op.star) : '';
                const classTag = op.class || '';
                const eliteTag = op.elite || '';
                const initial = name.charAt(0).toUpperCase();
                let avatarHtml = '';
                if (avatarUrl) {
                    avatarHtml = `<img src="${avatarUrl}" alt="${name}" onerror="this.parentElement.innerHTML='<span class=\\'fallback\\'>${initial}</span>'; this.parentElement.style.background='';">`;
                } else {
                    avatarHtml = `<span class="fallback">${initial}</span>`;
                }
                return `
                    <span class="result-operator">
                        <span class="result-avatar">${avatarHtml}</span>
                        <span class="result-info">
                            <span class="rname" title="${name}">${name}</span>
                            ${starStr ? `<span class="rstar">${starStr}</span>` : ''}
                            ${classTag ? `<span class="rclass">${classTag}</span>` : ''}
                            ${eliteTag ? `<span class="relite">${eliteTag}</span>` : ''}
                        </span>
                    </span>
                `;
            }

            let resultHtml = `<div class="result-strategy">📋 策略：${strategy}</div>`;

            resultHtml += `
                <div class="result-station">
                    <div class="station-title">🏢 控制中枢</div>
                    <div class="shift-row">
                        <span class="shift-label">第1班：</span>
                        ${center1.team.map(name => buildOperatorHtml(name)).join('')}
                        ${center1.team.length < 5 ? `<span class="result-placeholder">（空余${5 - center1.team.length}个位置）</span>` : ''}
                    </div>
                    <div class="shift-row">
                        <span class="shift-label">第2班：</span>
                        ${center2.team.map(name => buildOperatorHtml(name)).join('')}
                        ${center2.team.length < 5 ? `<span class="result-placeholder">（空余${5 - center2.team.length}个位置）</span>` : ''}
                    </div>
                </div>
            `;

            const order = [];
            for (let i = 1; i <= tradeCount; i++) {
                order.push({ label: `贸易站${i}`, tag: tradeLabels[i-1] || '龙门商法' });
            }
            for (let i = 1; i <= akCount; i++) order.push({ label: `赤金制造站${i}`, tag: '' });
            for (let i = 1; i <= oriCount; i++) order.push({ label: `源石制造站${i}`, tag: '' });
            for (let i = 1; i <= expCount; i++) order.push({ label: `经验制造站${i}`, tag: '' });

            for (let item of order) {
                const label = item.label;
                const tag = item.tag;
                const team1 = first.assignments[label] || ["无合适干员"];
                const team2 = second.assignments[label] || ["无合适干员"];

                let tagClass = '';
                let tagDisplay = '';
                if (tag === '开采协力') {
                    tagClass = 'station-tag cooperation';
                    tagDisplay = '⛏ 开采协力';
                } else if (tag === '龙门商法') {
                    tagClass = 'station-tag longmen';
                    tagDisplay = '🏛 龙门商法';
                }

                resultHtml += `
                    <div class="result-station">
                        <div class="station-title">
                            ${label}
                            ${tagDisplay ? `<span class="${tagClass}">${tagDisplay}</span>` : ''}
                        </div>
                        <div class="shift-row">
                            <span class="shift-label">第1班：</span>
                            ${team1.map(name => buildOperatorHtml(name)).join('')}
                        </div>
                        <div class="shift-row">
                            <span class="shift-label">第2班：</span>
                            ${team2.map(name => buildOperatorHtml(name)).join('')}
                        </div>
                    </div>
                `;
            }

            const allUsed = new Set([...centerUsed1, ...centerUsed2, ...first.used, ...second.used]);
            const unused = owned.filter(op => !allUsed.has(op));
            if (unused.length > 0) {
                resultHtml += `
                    <div class="result-unused">
                        完全未使用的干员：<span>${unused.join('、')}</span>
                    </div>
                `;
            }

            resultEl.innerHTML = resultHtml;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            showToast(`✅ 方案已生成，共使用 ${allUsed.size} 名干员`, 1800);
        }

        // =====================================================================
        //  初始化
        // =====================================================================
        document.addEventListener('DOMContentLoaded', () => {
            setLayout('243');

            layoutBtns.forEach(btn => {
                btn.addEventListener('click', () => { setLayout(btn.dataset.layout); });
            });

            filterTabs.querySelectorAll('.filter-tab').forEach(el => {
                el.addEventListener('click', () => { setFilter(el.dataset.filter); });
            });

            starFilterRow.querySelectorAll('.filter-tab').forEach(el => {
                el.addEventListener('click', () => { setStarFilter(el.dataset.star); });
            });

            classFilterRow.querySelectorAll('.filter-tab').forEach(el => {
                el.addEventListener('click', () => { setClassFilter(el.dataset.class); });
            });

            opSearch.addEventListener('input', doSearch);
            clearSearchBtn.addEventListener('click', () => {
                opSearch.value = '';
                doSearch();
                opSearch.focus();
            });

            document.getElementById('selectAllBtn').addEventListener('click', selectAll);
            document.getElementById('invertBtn').addEventListener('click', invertSelect);
            generateBtn.addEventListener('click', generatePlan);

            renderGrid();
            updateGenerateBtn();

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    opSearch.focus();
                    opSearch.select();
                }
                if (e.key === 'Escape') opSearch.blur();
            });
        });
    </script>
</body>
</html>
