<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>明日方舟基建排版器</title>
    <style>
        /* ========== 全局重置 & 方舟主题 ========== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0b0b1a;
            color: #e8e6e3;
            padding: 16px 12px 40px;
            min-height: 100vh;
            background-image: radial-gradient(ellipse at 50% 0%, #1a1a3e 0%, #0b0b1a 70%);
            overflow-x: hidden;
        }

        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(240, 196, 90, 0.4);
            border-radius: 8px;
        }

        .app-wrap {
            max-width: 480px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ========== 开场动画遮罩（仅文字） ========== */
        #splashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at 50% 60%, #1a1a3e 0%, #0b0b1a 80%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.9s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.9s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #splashOverlay.hide {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-text {
            text-align: center;
            opacity: 0;
            animation: textFadeIn 1.2s ease 0.6s forwards;
        }
        .splash-text .main {
            font-size: 2.2rem;
            font-weight: 700;
            color: #f0c45a;
            text-shadow: 0 0 40px rgba(240, 196, 90, 0.2), 0 4px 20px rgba(0, 0, 0, 0.6);
            letter-spacing: 2px;
            line-height: 1.3;
        }
        .splash-text .sub {
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 8px;
            letter-spacing: 4px;
            font-weight: 300;
        }
        .splash-text .highlight {
            color: #ff6b8a;
            text-shadow: 0 0 30px rgba(255, 107, 138, 0.3);
        }

        @keyframes textFadeIn {
            0% {
                opacity: 0;
                transform: translateY(16px) scale(0.96);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .tap-hint {
            margin-top: 28px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.15);
            letter-spacing: 2px;
            animation: pulseHint 2s ease-in-out infinite;
        }
        @keyframes pulseHint {
            0%,
            100% {
                opacity: 0.15;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(1.05);
            }
        }

        /* ========== 原应用样式（保持不变） ========== */
        .header {
            text-align: center;
            padding: 8px 0 18px;
            position: relative;
        }
        .header::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #f0c45a, transparent);
            margin: 10px auto 0;
            border-radius: 4px;
        }
        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f0c45a;
            letter-spacing: 2px;
            text-shadow: 0 0 30px rgba(240, 196, 90, 0.15);
        }
        .header h1 small {
            font-size: 0.7rem;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.35);
            display: block;
            margin-top: 2px;
        }

        .card {
            background: rgba(22, 33, 62, 0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 16px 14px;
            margin-bottom: 14px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }
        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: #f0c45a;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .card-title .badge {
            background: rgba(240, 196, 90, 0.15);
            color: #f0c45a;
            font-size: 0.65rem;
            padding: 0 10px;
            border-radius: 20px;
            font-weight: 400;
        }

        .layout-group {
            display: flex;
            gap: 10px;
        }
        .layout-btn {
            flex: 1;
            padding: 10px 0;
            border: 2px solid rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.02);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s;
            text-align: center;
            font-family: inherit;
        }
        .layout-btn:hover {
            border-color: rgba(240, 196, 90, 0.3);
            color: #e8e6e3;
        }
        .layout-btn.active {
            border-color: #f0c45a;
            background: rgba(240, 196, 90, 0.08);
            color: #f0c45a;
            box-shadow: 0 0 20px rgba(240, 196, 90, 0.06);
        }
        .layout-btn .sub {
            display: block;
            font-size: 0.6rem;
            font-weight: 400;
            opacity: 0.5;
            margin-top: 2px;
        }
        .layout-btn.active .sub {
            opacity: 0.7;
        }

        .op-search-wrap {
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        .op-search-wrap input {
            flex: 1;
            padding: 8px 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(0, 0, 0, 0.35);
            color: #e8e6e3;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.25s;
            font-family: inherit;
        }
        .op-search-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        .op-search-wrap input:focus {
            border-color: rgba(240, 196, 90, 0.4);
        }
        .op-search-wrap .clear-btn {
            padding: 0 14px;
            border-radius: 10px;
            border: none;
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.3);
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .op-search-wrap .clear-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #e8e6e3;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 6px;
            margin-bottom: 8px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .filter-tabs::-webkit-scrollbar {
            display: none;
        }
        .filter-tab {
            flex-shrink: 0;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.03);
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            white-space: nowrap;
        }
        .filter-tab:hover {
            color: #e8e6e3;
            border-color: rgba(255, 255, 255, 0.12);
        }
        .filter-tab.active {
            background: rgba(240, 196, 90, 0.12);
            border-color: #f0c45a;
            color: #f0c45a;
        }
        .filter-tab .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: middle;
        }

        .filter-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }
        .filter-row .filter-tab {
            padding: 2px 12px;
            font-size: 0.7rem;
        }

        .op-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            max-height: 340px;
            overflow-y: auto;
            padding-right: 2px;
        }
        @media (max-width: 400px) {
            .op-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .op-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 4px 8px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.02);
            border: 2px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
            position: relative;
            min-height: 76px;
        }
        .op-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.08);
        }
        .op-card:active {
            transform: scale(0.96);
        }
        .op-card.selected {
            border-color: #f0c45a;
            background: rgba(240, 196, 90, 0.08);
            box-shadow: 0 0 20px rgba(240, 196, 90, 0.06);
        }
        .op-card.selected .op-avatar {
            box-shadow: 0 0 0 3px rgba(240, 196, 90, 0.3);
        }
        .op-card .check-mark {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.7rem;
            color: #f0c45a;
            opacity: 0;
            transform: scale(0.6);
            transition: all 0.2s;
        }
        .op-card.selected .check-mark {
            opacity: 1;
            transform: scale(1);
        }
        .op-card.disabled {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
            filter: grayscale(0.6);
        }

        .op-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
            transition: box-shadow 0.2s;
            margin-bottom: 3px;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.3);
            background-size: cover !important;
            background-position: center !important;
            background-repeat: no-repeat !important;
            overflow: hidden;
            position: relative;
        }
        .op-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: block;
        }
        .op-avatar .fallback-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.5);
        }

        .op-name {
            font-size: 0.7rem;
            font-weight: 500;
            color: #c8c6c3;
            text-align: center;
            line-height: 1.2;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .op-meta {
            font-size: 0.55rem;
            color: rgba(255, 255, 255, 0.3);
            text-align: center;
            line-height: 1.3;
            margin-top: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
        }
        .op-meta .star {
            color: #f0c45a;
            letter-spacing: 1px;
        }
        .op-meta .class-tag {
            background: rgba(255, 255, 255, 0.06);
            padding: 0 6px;
            border-radius: 8px;
            margin-left: 4px;
        }

        .op-tag {
            font-size: 0.5rem;
            padding: 1px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.06);
            color: rgba(255, 255, 255, 0.35);
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
        .op-card.selected .op-tag {
            color: rgba(240, 196, 90, 0.6);
        }

        .color-trade {
            background: linear-gradient(135deg, #2d5f9e, #4a7fc7);
        }
        .color-赤金 {
            background: linear-gradient(135deg, #c9922a, #f0c45a);
        }
        .color-经验 {
            background: linear-gradient(135deg, #2d7d4a, #4caf7a);
        }
        .color-源石 {
            background: linear-gradient(135deg, #6d2d8a, #9c4dca);
        }
        .color-通用 {
            background: linear-gradient(135deg, #4a4a5a, #7a7a8a);
        }
        .color-默认 {
            background: linear-gradient(135deg, #3a3a4a, #5a5a6a);
        }

        .op-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            flex-wrap: wrap;
            gap: 6px;
        }
        .op-stats .count {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.5);
        }
        .op-stats .count strong {
            color: #f0c45a;
            font-weight: 600;
        }
        .op-stats .actions {
            display: flex;
            gap: 6px;
        }
        .op-stats .actions button {
            padding: 4px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.7rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
        }
        .op-stats .actions button:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #e8e6e3;
        }
        .op-stats .actions button:active {
            transform: scale(0.95);
        }

        .btn-generate {
            width: 100%;
            padding: 14px 0;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #e94560, #c23152);
            color: #fff;
            font-size: 1.05rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 1px;
            box-shadow: 0 4px 24px rgba(233, 69, 96, 0.25);
        }
        .btn-generate:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 32px rgba(233, 69, 96, 0.35);
        }
        .btn-generate:active {
            transform: scale(0.97);
        }
        .btn-generate:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none;
        }

        #resultCard {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #result {
            white-space: pre-wrap;
            font-size: 0.82rem;
            line-height: 1.7;
            color: #c8c6c3;
            background: rgba(0, 0, 0, 0.25);
            border-radius: 10px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            max-height: 460px;
            overflow-y: auto;
            font-family: "SF Mono", "Menlo", monospace;
        }

        .empty-state {
            text-align: center;
            padding: 28px 0 16px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 0.85rem;
        }
        .empty-state .icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 6px;
            opacity: 0.4;
        }

        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(22, 33, 62, 0.95);
            backdrop-filter: blur(12px);
            padding: 10px 24px;
            border-radius: 12px;
            border: 1px solid rgba(240, 196, 90, 0.15);
            color: #e8e6e3;
            font-size: 0.85rem;
            opacity: 0;
            transition: all 0.4s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
            text-align: center;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* ========== 响应式调整 ========== */
        @media (max-width: 420px) {
            .splash-text .main {
                font-size: 1.6rem;
            }
            .splash-text .sub {
                font-size: 0.75rem;
            }
            .tap-hint {
                font-size: 0.65rem;
            }
        }
    </style>
</head>
<body>

    <!-- ========== 开场动画遮罩（仅文字） ========== -->
    <div id="splashOverlay">
        <div class="splash-text">
            <div class="main">🐾 抖音关注 <span class="highlight">黑猫</span> 谢谢喵！</div>
            <div class="sub">✦ 明日方舟 · 基建排版器 ✦</div>
        </div>
        <div class="tap-hint">✦ 点击任意处进入 ✦</div>
    </div>

    <!-- ========== 主应用 ========== -->
    <div class="app-wrap">
        <header class="header">
            <h1>🔧 基建排版器 <small>ARKNIGHTS · 两班倒</small></h1>
        </header>

        <section class="card">
            <div class="card-title">📐 布局方案</div>
            <div class="layout-group" id="layoutGroup">
                <button class="layout-btn active" data-layout="243">243 <span class="sub">2贸易 · 4制造</span></button>
                <button class="layout-btn" data-layout="333">333 <span class="sub">3贸易 · 3制造</span></button>
            </div>
        </section>

        <section class="card" id="opSection">
            <div class="card-title">
                🧑‍🚀 干员选择
                <span class="badge" id="opCountBadge">0 已选</span>
            </div>
            <div class="op-search-wrap">
                <input type="text" id="opSearch" placeholder="搜索干员..." autocomplete="off" />
                <button class="clear-btn" id="clearSearchBtn" title="清除搜索">✕</button>
            </div>
            <div class="filter-tabs" id="filterTabs">
                <button class="filter-tab active" data-filter="all">全部</button>
                <button class="filter-tab" data-filter="贸易站"><span class="dot" style="background:#4a7fc7;"></span>贸易</button>
                <button class="filter-tab" data-filter="赤金"><span class="dot" style="background:#f0c45a;"></span>赤金</button>
                <button class="filter-tab" data-filter="经验"><span class="dot" style="background:#4caf7a;"></span>经验</button>
                <button class="filter-tab" data-filter="源石"><span class="dot" style="background:#9c4dca;"></span>源石</button>
                <button class="filter-tab" data-filter="通用"><span class="dot" style="background:#7a7a8a;"></span>通用</button>
            </div>
            <!-- 星级和职业筛选（可点击） -->
            <div class="filter-row" id="starFilterRow">
                <span style="color:rgba(255,255,255,0.3); font-size:0.7rem; margin-right:4px;">⭐</span>
                <button class="filter-tab active" data-star="all">全部</button>
                <button class="filter-tab" data-star="6">★6</button>
                <button class="filter-tab" data-star="5">★5</button>
                <button class="filter-tab" data-star="4">★4</button>
                <button class="filter-tab" data-star="3">★3</button>
                <button class="filter-tab" data-star="2">★2</button>
                <button class="filter-tab" data-star="1">★1</button>
            </div>
            <div class="filter-row" id="classFilterRow">
                <span style="color:rgba(255,255,255,0.3); font-size:0.7rem; margin-right:4px;">职业</span>
                <button class="filter-tab active" data-class="all">全部</button>
                <button class="filter-tab" data-class="先锋">先锋</button>
                <button class="filter-tab" data-class="近卫">近卫</button>
                <button class="filter-tab" data-class="重装">重装</button>
                <button class="filter-tab" data-class="狙击">狙击</button>
                <button class="filter-tab" data-class="术师">术师</button>
                <button class="filter-tab" data-class="医疗">医疗</button>
                <button class="filter-tab" data-class="辅助">辅助</button>
                <button class="filter-tab" data-class="特种">特种</button>
            </div>
            <div class="op-grid" id="opGrid"></div>
            <div class="op-stats">
                <span class="count">已选 <strong id="selectedCount">0</strong> / <span id="totalCount">0</span> 名干员</span>
                <div class="actions">
                    <button id="selectAllBtn">全选</button>
                    <button id="invertBtn">反选</button>
                </div>
            </div>
        </section>

        <button class="btn-generate" id="generateBtn">📋 生成两班倒方案</button>

        <section class="card" id="resultCard">
            <div class="card-title">📋 排版结果</div>
            <div id="result"></div>
        </section>

        <div class="toast" id="toast"></div>
    </div>

    <script>
        // =====================================================================
        //  开场动画逻辑
        // =====================================================================
        (function splash() {
            const overlay = document.getElementById('splashOverlay');

            function dismiss() {
                overlay.classList.add('hide');
                overlay.removeEventListener('click', dismiss);
                overlay.removeEventListener('touchstart', dismiss);
                document.removeEventListener('keydown', keyHandler);
            }

            function keyHandler(e) {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    dismiss();
                }
            }

            overlay.addEventListener('click', dismiss);
            overlay.addEventListener('touchstart', dismiss, { passive: true });
            document.addEventListener('keydown', keyHandler);

            setTimeout(dismiss, 4200);
        })();


        // =====================================================================
        //  干员数据（已修正职业和单挂黑名单）
        // =====================================================================

        const TRADE_PAIRS = [

            ["能天使", "维娜·维多利亚", "空爆", "月见夜", "古米", "齐尔查克"],

        // =====================================================================
        //  核心算法（调整：排除单挂黑名单，结果不展示效率）
        // =====================================================================

        function getBaseEff(name, product) {
            const op = OPERATORS[name];
            if (!op) return 0;
            if (product && op.product !== "通用" && op.product !== product) return 0;
            return op.base;
        }

        // 计算效率仍然保留内部使用，但最终不显示
        function calcTeamEff(team, facilityType, product) {
            let total = 0,
                typeCount = {};
            const validTeam = team.filter(n => n in OPERATORS);
            for (let name of validTeam) {
                const op = OPERATORS[name];
                if (op.facility !== facilityType) return -1;
                if (product && op.product !== "通用" && op.product !== product) return -1;
                total += op.base;
                typeCount[op.type] = (typeCount[op.type] || 0) + 1;
            }
            for (let name of validTeam) {
                const op = OPERATORS[name];
                if (op.combo) {
                    for (let [ct, need] of Object.entries(op.combo)) {
                        if ((typeCount[ct] || 0) >= need) total += op.combo_bonus || 0;
                    }
                }
            }
            if (facilityType === "贸易站") {
                const teamSet = new Set(validTeam);
                for (let combo of TRADE_COMBOS) {
                    if (combo.required.every(reqSet => reqSet.some(name => teamSet.has(name)))) {
                        total += combo.bonus;
                        break;
                    }
                }
            } else if (facilityType === "制造站") {
                const teamSet = new Set(validTeam);
                const combos = product === "赤金" ? AK_COMBOS : (product === "源石材料" ? ORI_COMBOS :
                EXPERIENCE_COMBOS);
                for (let combo of combos) {
                    if (combo.required.every(reqSet => reqSet.some(name => teamSet.has(name)))) {
                        total += combo.bonus;
                        break;
                    }
                }
            }
            return total;
        }

        // 工具：过滤掉单挂黑名单
        function filterForbidden(arr) {
            return arr.filter(name => !SINGLE_HANG_FORBIDDEN.has(name));
        }

        function allocateTrade(availableSet, numStations) {
            const used = new Set();
            const teams = [];
            const available = new Set(availableSet);
            for (let combo of TRADE_COMBOS) {
                if (teams.length >= numStations) break;
                let chosen = [],
                    possible = true;
                for (let reqSet of combo.required) {
                    let found = null;
                    for (let name of reqSet) {
                        if (available.has(name) && !used.has(name)) { found = name; break; }
                    }
                    if (!found) { possible = false; break; }
                    chosen.push(found);
                }
                if (possible) {
                    teams.push(chosen);
                    chosen.forEach(n => { used.add(n);
                        available.delete(n); });
                }
            }
            while (teams.length < numStations) {
                let team = null;
                for (let pair of TRADE_PAIRS) {
                    const [a, b] = pair;
                    if (available.has(a) && available.has(b) && !used.has(a) && !used.has(b)) {
                        const third = [...available].filter(n => {
                            if (used.has(n) || n === a || n === b) return false;
                            return OPERATORS[n].facility === "贸易站";
                        })
                        .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))  // 排除单挂黑名单
                        .sort((x, y) => {
                            const idxX = TRADE_TIERS.findIndex(t => t.includes(x));
                            const idxY = TRADE_TIERS.findIndex(t => t.includes(y));
                            if (idxX === -1 && idxY === -1) return getBaseEff(y, "通用") - getBaseEff(x,
                            "通用");
                            if (idxX === -1) return 1;
                            if (idxY === -1) return -1;
                            return idxX - idxY || getBaseEff(y, "通用") - getBaseEff(x, "通用");
                        })[0];
                        if (third) team = [a, b, third];
                        else team = [a, b];
                        break;
                    }
                }
                if (!team) {
                    const candidates = [];
                    for (let tier of TRADE_TIERS) {
                        for (let name of tier) {
                            if (available.has(name) && !used.has(name) && OPERATORS[name].facility ===
                                "贸易站" && !SINGLE_HANG_FORBIDDEN.has(name)) {
                                candidates.push(name);
                            }
                        }
                    }
                    const rest = [...available].filter(n => !used.has(n) && OPERATORS[n].facility === "贸易站" && !SINGLE_HANG_FORBIDDEN.has(n))
                        .sort((a, b) => getBaseEff(b, "通用") - getBaseEff(a, "通用"));
                    for (let n of rest)
                        if (!candidates.includes(n)) candidates.push(n);
                    team = candidates.slice(0, 3);
                }
                if (!team || team.length === 0) teams.push(["无合适干员"]);
                else { teams.push(team);
                    team.forEach(n => { used.add(n);
                        available.delete(n); }); }
            }
            return { teams, used };
        }

        function allocateProduct(availableSet, combos, product, numStations) {
            const used = new Set();
            const teams = [];
            const available = new Set(availableSet);
            for (let combo of combos) {
                if (teams.length >= numStations) break;
                let chosen = [],
                    possible = true;
                for (let reqSet of combo.required) {
                    let found = null;
                    for (let name of reqSet) {
                        if (available.has(name) && !used.has(name)) { found = name; break; }
                    }
                    if (!found) { possible = false; break; }
                    chosen.push(found);
                }
                if (possible) {
                    teams.push(chosen);
                    chosen.forEach(n => { used.add(n);
                        available.delete(n); });
                }
            }
            while (teams.length < numStations) {
                const productCandidates = [...available].filter(n => {
                    if (used.has(n) || FIXED_ONLY_OPS.has(n)) return false;
                    const op = OPERATORS[n];
                    return op && op.facility === "制造站" && op.product === product;
                })
                .filter(n => !SINGLE_HANG_FORBIDDEN.has(n)) // 排除单挂黑名单
                .sort((a, b) => getBaseEff(b, product) - getBaseEff(a, product));
                let team = productCandidates.slice(0, 3);
                if (team.length < 3) {
                    const genericCandidates = [...available].filter(n => {
                        if (used.has(n) || FIXED_ONLY_OPS.has(n)) return false;
                        const op = OPERATORS[n];
                        return op && op.facility === "制造站" && op.product === "通用";
                    })
                    .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, product) - getBaseEff(a, product));
                    const needed = 3 - team.length;
                    team = team.concat(genericCandidates.slice(0, needed));
                }
                if (team.length === 0) teams.push(["无合适干员"]);
                else { teams.push(team);
                    team.forEach(n => { used.add(n);
                        available.delete(n); }); }
            }
            return { teams, used };
        }

        function allocateOriginium(availableSet, numStations) {
            const used = new Set();
            const teams = [];
            const available = new Set(availableSet);
            for (let combo of ORI_COMBOS) {
                if (teams.length >= numStations) break;
                let chosen = [],
                    possible = true;
                for (let reqSet of combo.required) {
                    let found = null;
                    for (let name of reqSet) {
                        if (available.has(name) && !used.has(name)) { found = name; break; }
                    }
                    if (!found) { possible = false; break; }
                    chosen.push(found);
                }
                if (possible) {
                    teams.push(chosen);
                    chosen.forEach(n => { used.add(n);
                        available.delete(n); });
                }
            }
            while (teams.length < numStations) {
                let team = null;
                const coreCandidate = ["蛇屠箱", "黑角"].find(n => available.has(n) && !used.has(n) && !SINGLE_HANG_FORBIDDEN.has(n));
                if (coreCandidate) {
                    const otherSource = [...available].filter(n => {
                        if (used.has(n) || n === coreCandidate) return false;
                        if (FIXED_ONLY_OPS.has(n) && n !== "蛇屠箱" && n !== "黑角") return false;
                        const op = OPERATORS[n];
                        return op && op.facility === "制造站" && op.product === "源石材料";
                    })
                    .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, "源石材料") - getBaseEff(a, "源石材料"));
                    if (otherSource.length >= 2) team = [coreCandidate, ...otherSource.slice(0, 2)];
                }
                if (!team) {
                    const pureSource = [...available].filter(n => {
                        if (used.has(n)) return false;
                        if (FIXED_ONLY_OPS.has(n) && n !== "蛇屠箱" && n !== "黑角") return false;
                        const op = OPERATORS[n];
                        return op && op.facility === "制造站" && op.product === "源石材料";
                    })
                    .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                    .sort((a, b) => getBaseEff(b, "源石材料") - getBaseEff(a, "源石材料"));
                    if (pureSource.length >= 3) {
                        team = pureSource.slice(0, 3);
                    } else {
                        const genericFill = [...available].filter(n => {
                            if (used.has(n) || FIXED_ONLY_OPS.has(n)) return false;
                            const op = OPERATORS[n];
                            return op && op.facility === "制造站" && op.product === "通用";
                        })
                        .filter(n => !SINGLE_HANG_FORBIDDEN.has(n))
                        .sort((a, b) => getBaseEff(b, "源石材料") - getBaseEff(a, "源石材料"));
                        team = pureSource.concat(genericFill).slice(0, 3);
                    }
                }
                if (!team || team.length === 0) teams.push(["无合适干员"]);
                else { teams.push(team);
                    team.forEach(n => { used.add(n);
                        available.delete(n); }); }
            }
            return { teams, used };
        }

        function fullAllocation(owned, tradeCount, akCount, oriCount, expCount) {
            const globalAvailable = new Set(owned);
            const assignments = {};
            const usedTotal = new Set();
            const akRes = allocateProduct(globalAvailable, AK_COMBOS, "赤金", akCount);
            for (let i = 0; i < akCount; i++) assignments[`赤金制造站${i+1}`] = akRes.teams[i] || ["无合适干员"];
            akRes.used.forEach(n => { usedTotal.add(n);
                globalAvailable.delete(n); });
            const oriRes = allocateOriginium(globalAvailable, oriCount);
            for (let i = 0; i < oriCount; i++) assignments[`源石制造站${i+1}`] = oriRes.teams[i] || ["无合适干员"];
            oriRes.used.forEach(n => { usedTotal.add(n);
                globalAvailable.delete(n); });
            const tradeRes = allocateTrade(globalAvailable, tradeCount);
            for (let i = 0; i < tradeCount; i++) assignments[`贸易站${i+1}`] = tradeRes.teams[i] || ["无合适干员"];
            tradeRes.used.forEach(n => { usedTotal.add(n);
                globalAvailable.delete(n); });
            const expRes = allocateProduct(globalAvailable, EXPERIENCE_COMBOS, "经验", expCount);
            for (let i = 0; i < expCount; i++) assignments[`经验制造站${i+1}`] = expRes.teams[i] || ["无合适干员"];
            expRes.used.forEach(n => { usedTotal.add(n);
                globalAvailable.delete(n); });
            return { assignments, used: usedTotal, unused: [...globalAvailable] };
        }

        function assignBothShifts(owned, tradeCount, akCount, oriCount, expCount) {
            const first = fullAllocation(owned, tradeCount, akCount, oriCount, expCount);
            const remaining = owned.filter(op => !first.used.has(op));
            const second = fullAllocation(remaining, tradeCount, akCount, oriCount, expCount);
            return { first, second };
        }

            const op = OPERATORS[name];

        // 渲染干员卡片（加入星级和职业筛选）
        function renderGrid() {
            const filter = currentFilter;
            const query = searchQuery.trim().toLowerCase();
            const star = starFilter;
            const cls = classFilter;

            let filtered = allOpNames.filter(name => {
                if (query && !name.toLowerCase().includes(query)) return false;
                const op = OPERATORS[name];
                if (!op) return false;
                // 产品/设施筛选
                if (filter === '贸易站' && op.facility !== '贸易站') return false;
                if (filter === '赤金' && !(op.facility === '制造站' && op.product === '赤金')) return false;
                if (filter === '经验' && !(op.facility === '制造站' && op.product === '经验')) return false;
                if (filter === '源石' && !(op.facility === '制造站' && op.product === '源石材料')) return false;
                if (filter === '通用' && !(op.facility === '制造站' && op.product === '通用')) return false;
                // 星级筛选
                if (star !== 'all' && op.star !== parseInt(star)) return false;
                // 职业筛选
                if (cls !== 'all' && op.class !== cls) return false;
                return true;
            });

            filtered.sort((a, b) => {
                const aSel = selectedOps.has(a) ? 1 : 0;
                const bSel = selectedOps.has(b) ? 1 : 0;
                return bSel - aSel;
            });

            if (filtered.length === 0) {

                    `<div class="empty-state" style="grid-column:1/-1;"><span class="icon">🔍</span>没有匹配的干员</div>`;

                let avatarHtml = '';

                    avatarHtml =
                        `<img src="${avatarUrl}" alt="${name}" onerror="this.style.display='none'; this.parentElement.innerHTML='<span class=\\'fallback-text\\'>${initial}</span>'; this.parentElement.style.background='';">`;
                } else {
                    avatarHtml = `<span class="fallback-text">${initial}</span>`;

                html += `
                        <div class="op-card ${isSelected ? 'selected' : ''} ${isForbidden ? 'disabled' : ''}" data-op="${name}">

                                ${starStr ? `<span class="star">${starStr}</span>` : ''}
                                ${cls ? `<span class="class-tag">${cls}</span>` : ''}
                            </div>
                            ${tag ? `<div class="op-tag">${tag}</div>` : ''}
                        </div>
                    `;

            opGrid.innerHTML = html;

        function toggleOp(name) {
            const isForbidden = FORBIDDEN_IN_333.has(name) && currentLayout === '333';
            if (isForbidden) return;
            if (selectedOps.has(name)) selectedOps.delete(name);

                if (FORBIDDEN_IN_333.has(name) && currentLayout === '333') return false;

                if (FORBIDDEN_IN_333.has(name) && currentLayout === '333') return false;
                return true;

        function generatePlan() {

            let tradeCount, akCount, oriCount, expCount, strategy;

                strategy = '2龙门商法 + 1开采协力';
            }

            const { first, second } = assignBothShifts(owned, tradeCount, akCount, oriCount, expCount);

            let resultText = `策略：${strategy}\n\n`;
            const order = [];
            for (let i = 1; i <= tradeCount; i++) order.push(`贸易站${i}`);
            for (let i = 1; i <= akCount; i++) order.push(`赤金制造站${i}`);
            for (let i = 1; i <= oriCount; i++) order.push(`源石制造站${i}`);
            for (let i = 1; i <= expCount; i++) order.push(`经验制造站${i}`);

            for (let label of order) {
                const team1 = first.assignments[label] || ["无合适干员"];
                const team2 = second.assignments[label] || ["无合适干员"];

                // 不再显示效率，只显示干员组合
                resultText += `▸ ${label}\n`;
                resultText += `  第1班: ${team1.join(" + ")}\n`;
                resultText += `  第2班: ${team2.join(" + ")}\n\n`;
            }

            const allUsed = new Set([...first.used, ...second.used]);
            const unused = owned.filter(op => !allUsed.has(op));
            if (unused.length > 0) {
                resultText += `完全未使用的干员：${unused.join("、")}`;
            }

            resultEl.textContent = resultText;
            resultCard.style.display = 'block';
            resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
            showToast(`✅ 方案已生成，共使用 ${allUsed.size} 名干员`, 1800);
        }

        // =====================================================================
        //  初始化
        // =====================================================================

        document.addEventListener('DOMContentLoaded', () => {
            setLayout('243');

            layoutBtns.forEach(btn => {
                btn.addEventListener('click', () => { setLayout(btn.dataset.layout); });
            });

            filterTabs.querySelectorAll('.filter-tab').forEach(el => {
                el.addEventListener('click', () => { setFilter(el.dataset.filter); });
            });

            // 星级筛选
            starFilterRow.querySelectorAll('.filter-tab').forEach(el => {
                el.addEventListener('click', () => { setStarFilter(el.dataset.star); });
            });

            // 职业筛选
            classFilterRow.querySelectorAll('.filter-tab').forEach(el => {
                el.addEventListener('click', () => { setClassFilter(el.dataset.class); });
            });

            opSearch.addEventListener('input', doSearch);
            clearSearchBtn.addEventListener('click', () => {
                opSearch.value = '';
                doSearch();
                opSearch.focus();
            });

            document.getElementById('selectAllBtn').addEventListener('click', selectAll);
            document.getElementById('invertBtn').addEventListener('click', invertSelect);
            generateBtn.addEventListener('click', generatePlan);

            renderGrid();
            updateGenerateBtn();

            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                    e.preventDefault();
                    opSearch.focus();
                    opSearch.select();
                }
                if (e.key === 'Escape') opSearch.blur();
            });
        });
    </script>
</body>
</html>
